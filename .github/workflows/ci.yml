name: CI
on:
  pull_request:
    branches: [main]
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    permissions:
      contents: read
    steps:
      - name: Get latest code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: bun run test

      - name: Build project
        run: bun run build
