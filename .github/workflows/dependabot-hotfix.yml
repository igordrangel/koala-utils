name: Dependabot hotfix prepare

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Sync package.json and bump hotfix
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Read base version from PR base
        id: base
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          base_version="$(git show "${base_sha}:package.json" | bun -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(p.version)')"
          echo "version=$base_version" >> "$GITHUB_OUTPUT"
          echo "Base version: $base_version"

      - name: Prepare publish (ranges + patch + APP_VERSION)
        env:
          BASE_VERSION: ${{ steps.base.outputs.version }}
        run: bun .github/scripts/dependabot-prepare-publish.mjs

      - name: Refresh lockfile workspace metadata
        run: bun install --ignore-scripts

      - name: Commit and push if needed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock docs/site/src/app/core/constants/app-version.ts
          git commit -m "Prepara publish: sincroniza package.json e sobe hotfix."
          git push
